name: probe-kdk
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-15-intel
    steps:
      - name: Fetch and mount KDK
        run: |
          set -eux
          curl -L --retry 3 -o /tmp/kdk.dmg https://github.com/dortania/KdkSupportPkg/releases/download/24F74/Kernel_Debug_Kit_15.5_build_24F74.dmg
          hdiutil attach /tmp/kdk.dmg -mountpoint /Volumes/KDK -nobrowse
          ls /Volumes/KDK
          sudo installer -pkg /Volumes/KDK/*.pkg -target /
          hdiutil detach /Volumes/KDK
          KDK=$(ls -d /Library/Developer/KDKs/*.kdk | head -1)
          echo "== KDK tree =="
          find "$KDK" -maxdepth 5 -type d | head -40
          echo "== headers =="
          find "$KDK" -name 'boot_args_abi.h' -o -name 'API.h' | head -20
          echo "== SDK local include =="
          ls -la "$(xcrun --show-sdk-path)/usr/local/include" | head -30
