name: build-xnu-arm64
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-path
      - name: Clone XNU
        run: git clone --depth 1 https://github.com/apple-oss-distributions/xnu.git xnu
      - name: Build ARM64 RELEASE
        run: |
          cd xnu
          RC_DARWIN_KERNEL_VERSION=12377.1.9 \
            make -j"$(sysctl -n hw.ncpu)" \
            ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=RELEASE BUILD_LTO=0
      - name: Upload build tree
        uses: actions/upload-artifact@v4
        with:
          name: xnu-arm64-release
          path: xnu/BUILD/RELEASE/ARM64
          if-no-files-found: error
